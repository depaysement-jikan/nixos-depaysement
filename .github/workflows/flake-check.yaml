name: Flake check
on:
  pull_request:
  push:
    branches:
      - develop
jobs:
  test:
    name: Flake check
    runs-on: ubuntu-latest
    container:
      image: nixos/nix:2.24.0
    steps:
      - name: Install Node.js for Actions
        run: |
          nix-channel --update
          nix-env -iA nixpkgs.nodejs

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests and linting in Nix shell
        run: |
          nix flake check --extra-experimental-features "nix-command flakes pipe-operators"
