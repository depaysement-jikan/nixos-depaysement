name: Flake check
on:
  pull_request:
  push:
    branches:
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run in Nix container
        uses: addnab/docker-run-action@v3
        with:
          image: nixos/nix:2.24.0
          options: --rm
          volumes: /home/runner/work/nixos-dotfiles/nixos-dotfiles:/workspace
          run: |
            cd /workspace
            nix-channel --update
            nix-env -iA nixpkgs.nodejs
            nix flake check --extra-experimental-features "nix-command flakes pipe-operators"
